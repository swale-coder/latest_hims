<!DOCTYPE html>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a3d33">
  <script>
    // Paint the login gradient from the very first frame (before css/js finish loading)
    // so there is no white/light flash ahead of the login screen.
    (function () {
      try {
        var h = location.hash;
        if (h === '#/login' || !localStorage.getItem('hms_token')) document.documentElement.classList.add('login-bg');
      } catch (e) { document.documentElement.classList.add('login-bg'); }
    })();
  </script>
  <style>html.login-bg, html.login-bg body { background: linear-gradient(160deg, #0a3d33, #0b1f33) fixed; }</style>
