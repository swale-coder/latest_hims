<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Aiventra</title>
<link rel="stylesheet" href="/marketing/marketing.css">
<style>.auth-shell { max-width: 420px; margin: 0 auto; padding: 90px 0; }</style>
</head>
<body>
<header id="site-header" class="site-header"></header>

<section class="wrap auth-shell">
  <div class="reveal" style="text-align:center;margin-bottom:28px">
    <h1 style="font-size:clamp(26px,3.6vw,34px)">Reset your password</h1>
    <p class="lede" style="margin:10px auto 0">Enter your username and we'll send reset instructions.</p>
  </div>

  <div class="form-card reveal" id="form-wrap">
    <form id="forgot-form">
      <div class="form-field"><label>Username</label><input type="text" id="f-username" required autocomplete="username"></div>
      <button type="submit" class="btn btn-primary" style="width:100%" id="forgot-submit">Send Reset Instructions</button>
      <p class="form-note" style="margin-top:14px;text-align:center"><a href="/#/login" style="color:var(--blue);font-weight:600">Back to login</a></p>
    </form>
  </div>
</section>

<footer id="site-footer" class="site-footer"></footer>
<script src="/marketing/marketing.js"></script>
<script>
  document.getElementById('forgot-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('forgot-submit');
    btn.disabled = true; btn.textContent = 'Sending...';
    try {
      const res = await fetch('/api/auth/forgot-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: document.getElementById('f-username').value })
      });
      const data = await res.json();
      document.getElementById('form-wrap').innerHTML = `<div class="form-success"><h3 style="margin-bottom:10px">Check your inbox</h3><p style="color:var(--muted)">${data.message || "If an account exists with that username, we've sent reset instructions."}</p></div>`;
    } catch (err) {
      btn.disabled = false; btn.textContent = 'Send Reset Instructions';
    }
  });
</script>
</body>
</html>
