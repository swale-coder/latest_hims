<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Aiventra</title>
<link rel="stylesheet" href="/marketing/marketing.css">
<style>.auth-shell { max-width: 420px; margin: 0 auto; padding: 90px 0; }</style>
</head>
<body>
<header id="site-header" class="site-header"></header>

<section class="wrap auth-shell">
  <div class="reveal" style="text-align:center;margin-bottom:28px">
    <h1 style="font-size:clamp(26px,3.6vw,34px)">Choose a new password</h1>
  </div>

  <div class="form-card reveal" id="form-wrap">
    <form id="reset-form">
      <div class="form-field"><label>New Password (min. 8 characters, with a letter and a number)</label><input type="password" id="r-password" required minlength="8" autocomplete="new-password"></div>
      <div class="form-field"><label>Confirm New Password</label><input type="password" id="r-password2" required minlength="8" autocomplete="new-password"></div>
      <button type="submit" class="btn btn-primary" style="width:100%" id="reset-submit">Reset Password</button>
      <p class="form-note" style="margin-top:14px;color:#d64545;display:none" id="reset-error"></p>
    </form>
  </div>
</section>

<footer id="site-footer" class="site-footer"></footer>
<script src="/marketing/marketing.js"></script>
<script>
  const token = new URLSearchParams(window.location.search).get('token');
  if (!token) {
    document.getElementById('form-wrap').innerHTML = '<div class="form-success"><h3>Missing reset link</h3><p style="color:var(--muted)">This page needs a reset token from your email link. <a href="/marketing/forgot-password.html" style="color:var(--blue)">Request a new one</a>.</p></div>';
  }

  document.getElementById('reset-form') && document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errBox = document.getElementById('reset-error');
    errBox.style.display = 'none';
    const p1 = document.getElementById('r-password').value;
    const p2 = document.getElementById('r-password2').value;
    if (p1 !== p2) { errBox.textContent = 'Passwords do not match.'; errBox.style.display = 'block'; return; }

    const btn = document.getElementById('reset-submit');
    btn.disabled = true; btn.textContent = 'Resetting...';
    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword: p1 })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not reset your password');
      document.getElementById('form-wrap').innerHTML = `<div class="form-success"><h3 style="margin-bottom:10px">Password reset</h3><p style="color:var(--muted)">${data.message}</p><a href="/#/login" class="btn btn-primary" style="margin-top:16px;display:inline-block">Go to Login</a></div>`;
    } catch (err) {
      errBox.textContent = err.message; errBox.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Reset Password';
    }
  });
</script>
</body>
</html>
