<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aiventra Admin Control Center</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  body { background: var(--bg); }
  .admin-topbar { display:flex; align-items:center; justify-content:space-between; padding:14px 24px; background:#fff; border-bottom:1px solid var(--line-soft); }
  .admin-topbar .brand { font-weight:800; color:var(--navy); font-size:16px; display:flex; align-items:center; gap:8px; }
  .admin-topbar .brand .dot { width:9px; height:9px; border-radius:50%; background:var(--teal-600); }
  .admin-shell { max-width:1200px; margin:0 auto; padding:24px; }
  .login-shell { max-width:380px; margin:80px auto; }
  .stat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  @media (max-width:900px) { .stat-grid { grid-template-columns:repeat(2,1fr); } }
  .stat-card { background:#fff; border:1px solid var(--line-soft); border-radius:12px; padding:16px 18px; }
  .stat-card .label { font-size:12px; color:var(--ink-faint); font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
  .stat-card .value { font-size:24px; font-weight:800; color:var(--navy); margin-top:4px; }
  table.admin-table { width:100%; border-collapse:collapse; font-size:13.5px; }
  table.admin-table th { text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); padding:10px 12px; border-bottom:1px solid var(--line-soft); }
  table.admin-table td { padding:10px 12px; border-bottom:1px solid var(--line-soft); }
  table.admin-table tr:hover td { background:var(--bg); cursor:pointer; }
  .field-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  .field-row label { font-size:12.5px; font-weight:600; color:var(--ink-faint); display:block; margin-bottom:4px; }
  .field-row input, .field-row select { width:100%; }
</style>
</head>
<body>

<div id="root"></div>

<script src="/js/admin.js"></script>
</body>
</html>
